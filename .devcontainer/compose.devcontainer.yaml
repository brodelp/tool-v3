# Dev container override for ../compose.yaml.
# Relative paths resolve against the first compose file's directory (the project root).
# A separate project name keeps the dev container from replacing the `docker compose up` service.
# It also gives the dev container its own database volume (scat-v3-devcontainer_pgdata).
name: scat-v3-devcontainer

services:
  api:
    build:
      context: .
      target: dev
    image: scat-validator:devcontainer
    read_only: false
    command: ["sleep", "infinity"]
    # libpq variables so `psql` and `make psql` connect without arguments.
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-scat}
      PGUSER: ${POSTGRES_USER:-scat}
      PGPASSWORD: ${POSTGRES_PASSWORD:-scat}
    volumes:
      - .:/app:cached
      # Claude Code login and settings survive container rebuilds.
      - claude-config:/home/vscode/.claude
      # npm needs symlinks (node_modules/.bin), which a Windows bind mount cannot hold, and a
      # Linux volume is much faster. The Dockerfile pre-creates this path owned by vscode.
      - frontend-node-modules:/app/frontend/node_modules
    # VS Code forwards 8000 instead, so the dev container can coexist with `docker compose up`.
    ports: !reset []
    healthcheck:
      disable: true

volumes:
  claude-config:
  frontend-node-modules:
