# Alembic configuration. The database URL comes from DATABASE_URL (see migrations/env.py).
# Apply migrations with `make migrate`; create one with
# `uv run --locked alembic revision -m "<message>"`.

[alembic]
# A package resource, so migrations ship inside the installed scat_validator package.
script_location = scat_validator:migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
