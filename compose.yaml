name: scat-v3

services:
  api:
    build:
      context: .
      target: runtime
    image: scat-validator:local
    init: true
    read_only: true
    tmpfs:
      - /tmp
    # Read by the stage 2 submission routes and by the migrations the image runs before serving.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scat}:${POSTGRES_PASSWORD:-scat}@db:5432/${POSTGRES_DB:-scat}
      # Stage 4 LLM annotation; unset or empty leaves it disabled (see README.md, LLM annotation).
      SCAT_LLM_PROVIDER: ${SCAT_LLM_PROVIDER:-}
      SCAT_LLM_MODEL: ${SCAT_LLM_MODEL:-}
      SCAT_LLM_API_KEY: ${SCAT_LLM_API_KEY:-}
      SCAT_LLM_BASE_URL: ${SCAT_LLM_BASE_URL:-}
      SCAT_LLM_TIMEOUT_SECONDS: ${SCAT_LLM_TIMEOUT_SECONDS:-}
      SCAT_LLM_MAX_OUTPUT_TOKENS: ${SCAT_LLM_MAX_OUTPUT_TOKENS:-}
    depends_on:
      db:
        condition: service_healthy
    # Host exposure is loopback-only by design (spec §5, §10).
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    # Keep the major version in step with postgresql-client in the Dockerfile's dev stage.
    image: postgres:18.6-trixie
    # Dev-only defaults; override them in a git-ignored .env (see .env.example).
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scat}
      POSTGRES_USER: ${POSTGRES_USER:-scat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scat}
    # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major>/docker, so the volume mounts
    # the parent directory; mounting the older .../data path would leave the data unpersisted.
    volumes:
      - pgdata:/var/lib/postgresql
    # No published port: only services on this Compose network reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
